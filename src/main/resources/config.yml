kits-menu:
  title: "Zestawy"
  rows: 5

  close-button:
    name: "<red>Zamknij"
    material: barrier
    amount: 1
    slot: 40
    lore: []

  kit-lore:
    - ""
    - "<dark_gray>» <gray>Ten kit można odbierać co: <white><cooldown>"
    - "<dark_gray>» <gray>Możesz odebrać <can-claim>"
    - ""
    - "<gray>Kliknij <white>PPM<gray>, aby przejść do zestawu!"
    - ""

  can-claim:
    available: "<green>TAK <bold>✔"
    no-permission: "<red>NIE <dark_red>✘"
    cooldown: "<gray>za: <red><formatted-time>"

kit-preview:
  title: "Zestawy"
  rows: 5

  back-button:
    name: "<red>Powrót!"
    material: barrier
    amount: 1
    slot: 44
    lore: []

  claim-button:
    slot: 43

    can-claim:
      name: "<green>Odbierz zestaw"
      material: lime_dye
      amount: 1
      lore:
        - " <dark_gray>» <gray>Kliknij <green>LPM <gray>aby odebrać zestaw "

    no-permission:
      name: "<dark_red>Brak dostepu"
      material: red_dye
      amount: 1
      lore:
        - " <dark_gray>» <gray>Nie posiadasz <red>dostepu <gray>do tego zestawu!"

    cooldown:
      name: "<yellow>Odbierz przedmioty z zestawu!"
      material: orange_dye
      amount: 1
      lore:
        - " <dark_gray>» <gray>Nastepny raz możesz odebrać za <white><formatted-time><gray>!"

claim-items:
  title: "Odbierz przedmioty"
  # rozmiar gui jest ustawiany automatycznie na tyle rzędów ile jest itemów

messages:
  claimed:
    # <formatted-name> - ta sama nazwa co nazwa ikony kitu w menu kitów
    chat: "<gray>Odebrano zestaw <white><formatted-name><gray>"
    title: ""
    subtitle: "<gray>Odebrano zestaw <white><formatted-name><gray>"

  claimed-all:
    chat: ""
    title: ""
    subtitle: "<green>Odebrano wszystkie przedmioty"

  no-permission:
    chat: "<red>Brak dostepu do zestawu..."
    title: ""
    subtitle: "<red>Brak dostepu do zestawu..."

  cooldown:
    chat: "<gray>Odczekaj jeszcze <white><formatted-time><gray>"
    title: "<red>Pusto!"
    subtitle: "<gray>Odczekaj jeszcze <white><formatted-time><gray>"